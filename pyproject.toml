[project]
name = "resumegen"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [{ name = "dev-in-f" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "configargparse>=1.7.5",
    "dotenv>=0.9.9",
    "jinja2",
    "litellm>=1.90.0",
    "mcp>=1.27.2",
    "pikepdf",
    "platformdirs>=4.10.0",
    "pydantic",
    "python-dotenv>=1.2.2",
    "pyyaml",
    "weasyprint",
]

[project.scripts]
resumegen = "resumegen.cli"
resumegen-mcp = "resumegen.mcp_server:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "1.0.0"

[dependency-groups]
dev = [
    "commitizen",
    "freezegun>=1.5.5",
    "hatchling>=1.30.1",
    "prek>=0.4.4",
    "pytest",
    "pytest-cov",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "I"]
unfixable = ["B"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*test_*.py"]

[tool.pyright]
ignore = ["tests/**"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
major_version_zero = true
