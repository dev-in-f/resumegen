[project]
name = "resumegen"
dynamic = ["version"]
description = "A Python tool for rendering resumes from structured data with some LLM assistance on the side"
readme = "README.md"
authors = [{ name = "dev-in-f" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "dotenv>=0.9.9",
    "jinja2",
    "litellm>=1.90.0",
    "pikepdf",
    "platformdirs>=4.10.0",
    "pydantic",
    "python-dotenv>=1.2.2",
    "pyyaml",
    "weasyprint",
]

[project.scripts]
resumegen = "resumegen.cli:app"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "1.0.0"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
[dependency-groups]
dev = [
    "commitizen",
    "freezegun>=1.5.5",
    "hatchling>=1.30.1",
    "prek>=0.4.4",
    "pytest",
    "pytest-cov",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FURB",
    "G",
    "I",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TID",
    "TRY",
    "UP",
]
unfixable = ["B"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.pyright]
ignore = ["tests/**"]
