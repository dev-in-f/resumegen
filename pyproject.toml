[project]
name = "resume-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "pikepdf>=10.7.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "weasyprint>=69.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "I"]
unfixable = ["B"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*test_*.py"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
major_version_zero = true
[dependency-groups]
dev = [
    "commitizen>=4.16.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
